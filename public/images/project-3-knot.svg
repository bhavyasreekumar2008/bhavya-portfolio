<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <radialGradient id="knotFloor" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#DCDCD9" />
      <stop offset="70%" stop-color="#EDEDED" />
      <stop offset="100%" stop-color="#F5F5F3" />
    </radialGradient>
    <linearGradient id="chromeKnot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E2DF" />
      <stop offset="45%" stop-color="#555552" />
      <stop offset="60%" stop-color="#FDFDFD" />
      <stop offset="80%" stop-color="#7A7A77" />
      <stop offset="100%" stop-color="#222220" />
    </linearGradient>
    <filter id="knotDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="28" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Studio backdrop -->
  <rect width="1000" height="800" fill="url(#knotFloor)" />
  <line x1="80" y1="640" x2="920" y2="640" stroke="#D5D5D0" stroke-width="1" />

  <!-- Shadow under metallic sculpture -->
  <ellipse cx="500" cy="630" rx="220" ry="35" fill="#1C1C1B" opacity="0.18" filter="blur(8px)" />

  <!-- Metallic Knot / Intertwined Infinite Loop (Faithful to bottom right spread) -->
  <g transform="translate(500, 390)" filter="url(#knotDrop)">
    <!-- Lower underpass loop -->
    <path d="M -140,80 C -220,-20 -180,-140 -80,-160 C 20,-180 120,-110 140,-20 C 160,70 100,160 -10,170 C -90,180 -140,130 -140,80 Z" 
          fill="url(#chromeKnot)" stroke="#111111" stroke-width="2" />
    <!-- Overlapping interlock node -->
    <path d="M -80,-60 C -40,-130 50,-130 90,-60 C 130,10 90,90 20,110 C -50,130 -120,10 -80,-60 Z" 
          fill="url(#chromeKnot)" stroke="#222222" stroke-width="1.5" />
    <!-- Highlight reflections -->
    <path d="M -120,-80 C -60,-130 0,-130 60,-70" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M -60,90 C -10,130 50,120 90,60" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Swiss Architectural Spec Notation -->
  <text x="80" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#111111">FIG 03 // CHROME CONTINUUM</text>
  <text x="80" y="102" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#666666">PARAMETRIC INTERTWINED TOPOLOGY</text>
  <text x="920" y="740" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#888888">CATALOG REF // 03</text>
</svg>
