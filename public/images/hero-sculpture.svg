<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <radialGradient id="sculptureGrad1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E2DF" />
      <stop offset="70%" stop-color="#9C9C98" />
      <stop offset="100%" stop-color="#2D2D2C" />
    </radialGradient>
    <linearGradient id="sculptureGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F2F0" />
      <stop offset="50%" stop-color="#CCCCCC" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
    <linearGradient id="sculptureGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#B8B8B4" />
      <stop offset="100%" stop-color="#383838" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" />
      <feOffset dx="12" dy="24" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background architectural canvas -->
  <rect width="1200" height="1600" fill="#E8E8E6" />

  <!-- Diagonal brutalist shadow planes -->
  <polygon points="0,0 1200,300 1200,1600 0,1600" fill="#DFDFDC" />
  <polygon points="1200,600 500,1600 1200,1600" fill="#D2D2CE" />

  <!-- Massive Curved Arch Portal (Homage to Reference Cover) -->
  <path d="M 1200,120 C 800,150 480,380 340,680 C 220,950 210,1300 420,1600 L 1200,1600 Z" fill="url(#sculptureGrad1)" filter="url(#softShadow)" />

  <!-- Inner Negative Arch Void -->
  <path d="M 1200,280 C 920,320 620,540 520,840 C 420,1120 490,1400 680,1600 L 1200,1600 Z" fill="#1A1A1A" />

  <!-- Secondary Overlapping Intersecting Rib -->
  <path d="M 650,420 C 580,700 700,1050 950,1280 C 1050,1380 1150,1420 1200,1450 L 1200,1600 L 780,1600 C 520,1320 400,980 460,650 C 500,480 580,320 650,420 Z" fill="url(#sculptureGrad2)" filter="url(#softShadow)" />

  <!-- Foreground Floating Geometric Blade -->
  <polygon points="260,420 540,540 440,980 180,820" fill="url(#sculptureGrad3)" filter="url(#softShadow)" />

  <!-- Thin precision architectural grid marks -->
  <line x1="80" y1="80" x2="160" y2="80" stroke="#111111" stroke-width="2" />
  <line x1="80" y1="80" x2="80" y2="160" stroke="#111111" stroke-width="2" />
  <text x="80" y="200" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#111111">FIG. 00 // SCULPTURAL APERTURE</text>
  <text x="80" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#666666">STRUCTURAL CONCRETE &amp; SHADOW</text>
  <text x="1120" y="1520" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#FFFFFF">ARCHITECTURAL EDITION // 2026</text>
</svg>
